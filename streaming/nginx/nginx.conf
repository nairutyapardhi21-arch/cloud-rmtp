daemon off;
worker_processes auto;
events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      record off;
      on_publish http://api:3001/internal/ingest/publish;
      on_publish_done http://api:3001/internal/ingest/done;
    }
  }
}

http {
  include mime.types;
  default_type application/octet-stream;
  server {
    listen 80;
    location /health { return 200 'nginx-rtmp-ready\n'; }
    location /stat { rtmp_stat all; rtmp_stat_stylesheet stat.xsl; }
    location /stat.xsl { root /usr/share/nginx/html; }
  }
}
